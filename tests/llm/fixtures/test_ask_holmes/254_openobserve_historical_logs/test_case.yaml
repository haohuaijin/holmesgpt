user_prompt: "The payment-api service had issues recently. Check the logs in OpenObserve and tell me what happened."

expected_output:
  - The payment-api experienced failures caused by database connection pool exhaustion

tags:
  - logs
  - medium
  - openobserve
  - benchmark
  - fast

setup_timeout: 300

before_test: |
  set -e

  OO_URL="http://localhost:5080"
  OO_USER="root@example.com"
  OO_PASS="Complexpass#123"

  # Bypass proxy for localhost connections
  export NO_PROXY="localhost,127.0.0.1"
  export no_proxy="localhost,127.0.0.1"

  # Verify OpenObserve is reachable
  echo "Checking OpenObserve connectivity at ${OO_URL}..."
  HEALTH=$(curl -sf --noproxy localhost -u "${OO_USER}:${OO_PASS}" "${OO_URL}/healthz" 2>/dev/null || true)
  if [ -z "$HEALTH" ]; then
    echo "ERROR: Cannot reach OpenObserve at ${OO_URL}"
    echo "Make sure OpenObserve is running: docker run -d -p 5080:5080 -e ZO_ROOT_USER_EMAIL=root@example.com -e ZO_ROOT_USER_PASSWORD=Complexpass#123 public.ecr.aws/zinclabs/openobserve:v0.14.5"
    exit 1
  fi
  echo "OpenObserve is reachable"

  # Push test logs using the Python script
  echo "Generating and pushing logs to OpenObserve..."
  python3 ./push-logs.py "${OO_URL}" "${OO_USER}" "${OO_PASS}"

  # Verify logs were ingested (use 5 hours ago as start_time)
  echo "Verifying log ingestion..."
  START_US=$(python3 -c "from datetime import datetime,timedelta,timezone; print(int((datetime.now(timezone.utc)-timedelta(hours=5)).timestamp()*1e6))")
  for i in $(seq 1 30); do
    END_US=$(python3 -c "import time; print(int(time.time()*1000000))")
    RESULT=$(curl -sf --noproxy localhost -u "${OO_USER}:${OO_PASS}" \
      -X POST "${OO_URL}/api/default/_search" \
      -H "Content-Type: application/json" \
      -d '{"query":{"sql":"SELECT COUNT(*) as cnt FROM default WHERE level='"'"'ERROR'"'"'","start_time":'${START_US}',"end_time":'${END_US}',"size":1}}' 2>/dev/null || true)

    ERROR_COUNT=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('hits',[{}])[0].get('cnt',0))" 2>/dev/null || echo 0)

    if [ "$ERROR_COUNT" -gt "0" ] 2>/dev/null; then
      echo "Logs verified: ${ERROR_COUNT} ERROR logs found in OpenObserve"
      exit 0
    fi
    echo "Attempt $i/30: waiting for logs to be indexed..."
    sleep 2
  done

  echo "ERROR: Logs not found in OpenObserve after 60s"
  exit 1

after_test: |
  OO_URL="http://localhost:5080"
  OO_USER="root@example.com"
  OO_PASS="Complexpass#123"
  curl -sf -u "${OO_USER}:${OO_PASS}" -X DELETE "${OO_URL}/api/default/streams/default?type=logs" || true
  echo "Cleanup done"
